name: Update language breakdown

# Every Monday, re-measure the languages in x7lex's public repos and commit
# src/languages.rs if the numbers changed. Run it any time from the Actions tab.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (8 or 9 AM in Ottawa)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure languages
        run: python3 scripts/update_languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/languages.rs; then
            echo "Language breakdown unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/languages.rs
          git commit -m "Update language breakdown"
          git push
